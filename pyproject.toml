[project]
name = "e_commerce"
version = "0.1.0"
description = "e-commerce using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.1",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1"
]

[project.scripts]
e_commerce = "e_commerce.main:run"
run_crew = "e_commerce.main:run"
train = "e_commerce.main:train"
replay = "e_commerce.main:replay"
test = "e_commerce.main:test"
api = "e_commerce.api:start_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
